name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, types, migrations, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: quant
          POSTGRES_PASSWORD: quant
          POSTGRES_DB: quant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quant -d quant"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://quant:quant@localhost:5432/quant

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check app tests

      - name: Type check
        run: mypy app

      - name: Migrations apply from scratch and match the models
        run: |
          alembic upgrade head
          alembic check

      - name: Tests
        run: pytest

  docker:
    name: Docker image and compose stack
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Build and start the stack
        run: docker compose up -d --build

      - name: API is healthy and can reach the database
        run: >-
          curl --fail --silent --show-error
          --retry 30 --retry-delay 2 --retry-all-errors
          http://localhost:8000/api/v1/health/database

      - name: Migrations and seed ran
        run: |
          curl --fail --silent --show-error http://localhost:8000/api/v1/instruments \
            | python3 -c 'import json, sys; rows = json.load(sys.stdin); print(len(rows), "instruments"); sys.exit(0 if rows else 1)'

      - name: Market data requires a token
        run: |
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://localhost:8000/api/v1/market-data/instruments)
          echo "anonymous status: $status"
          test "$status" = "401"

      - name: Logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop
        if: always()
        run: docker compose down --volumes
