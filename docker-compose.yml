# Development stack. `docker compose up --build` starts everything;
# `docker compose up -d postgres` starts only the database (for running the API
# from a local virtualenv).

x-api: &api
  build: .
  image: quant-api:local
  # Settings come from .env when it exists; the application defaults apply otherwise.
  env_file:
    - path: .env
      required: false
  environment:
    # Inside the compose network the database is `postgres:5432`, whatever .env says.
    DATABASE_URL: postgresql+asyncpg://quant:quant@postgres:5432/quant

services:
  postgres:
    image: postgres:16
    container_name: quant-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: quant
      POSTGRES_PASSWORD: quant
      POSTGRES_DB: quant
    ports:
      - "5433:5432"
    volumes:
      - quant_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quant -d quant"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: bring the schema to head and load reference data (both safe to re-run).
  migrate:
    <<: *api
    command: ["sh", "-c", "alembic upgrade head && python -m app.cli seed"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *api
    restart: unless-stopped
    ports:
      # Published on localhost only: this stack uses development credentials.
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  quant_pgdata:
